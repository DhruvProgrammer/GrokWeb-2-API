services:
  grok-web-to-api:
    build: .
    container_name: grok-web-to-api
    ports:
      - "4982:4982"
    env_file:
      - .env
    environment:
      - PORT=4982
      - LOG_LEVEL=INFO
    volumes:
      - ./cookies:/home/appuser/.cookies:rw
      - type: tmpfs
        target: /tmp
        fs_type: tmpfs
        size_bytes: 536870912  # 512 MiB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4982/health', timeout=3).status in (200, 503) else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s